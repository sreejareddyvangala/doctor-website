<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of complex fracture fixation with a surgical plate and screws stabilising a segmented bone">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#CFE7FB"/>
    </linearGradient>
    <linearGradient id="ct-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F0FB"/>
    </linearGradient>
    <linearGradient id="ct-plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ACD80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ct-bg)"/>
  <circle cx="170" cy="470" r="160" fill="#0F6CBD" opacity="0.06"/>
  <circle cx="640" cy="140" r="150" fill="#22C55E" opacity="0.07"/>
  <rect width="800" height="600" fill="url(#ct-glow)"/>

  <g transform="translate(400 300) rotate(-14)">
    <!-- Proximal bone end -->
    <path d="M-296 -76 c-30 -20 -70 -10 -84 20 -14 28 0 60 30 70 -28 16 -34 54 -12 76 22 24 62 20 82 -6 l16 -22 v-118z"
          fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>
    <!-- Shaft, proximal segment -->
    <rect x="-266" y="-46" width="106" height="94" rx="16" fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7"/>
    <!-- Comminuted middle fragments -->
    <path d="M-146 -44 l82 -12 l14 50 l-88 16z" fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-40 -50 l86 6 l-8 56 l-72 -8z" fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>
    <!-- Shaft, distal segment -->
    <rect x="60" y="-46" width="106" height="94" rx="16" fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7"/>
    <!-- Distal bone end -->
    <path d="M166 -76 c30 -20 70 -10 84 20 14 28 0 60 -30 70 28 16 34 54 12 76 -22 24 -62 20 -82 -6 l-16 -22 v-118z"
          fill="url(#ct-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>

    <!-- Fixation plate spanning the fracture zone -->
    <rect x="-250" y="-104" width="472" height="46" rx="23" fill="url(#ct-plate)"/>
    <g fill="#FFFFFF">
      <circle cx="-206" cy="-81" r="11"/>
      <circle cx="-118" cy="-81" r="11"/>
      <circle cx="-30" cy="-81" r="11"/>
      <circle cx="58" cy="-81" r="11"/>
      <circle cx="146" cy="-81" r="11"/>
    </g>
    <!-- Screws into cortex -->
    <g stroke="#16A34A" stroke-width="12" stroke-linecap="round">
      <path d="M-206 -66 v34"/>
      <path d="M-30 -66 v34"/>
      <path d="M146 -66 v34"/>
    </g>
  </g>
</svg>

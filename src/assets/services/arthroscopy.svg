<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a minimally invasive arthroscopy procedure with a camera scope viewing inside a joint">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#CFE7FB"/>
    </linearGradient>
    <linearGradient id="ar-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F0FB"/>
    </linearGradient>
    <linearGradient id="ar-scope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B7FDD"/>
      <stop offset="1" stop-color="#0D569A"/>
    </linearGradient>
    <radialGradient id="ar-beam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ar-glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ar-bg)"/>
  <circle cx="660" cy="140" r="150" fill="#0F6CBD" opacity="0.06"/>
  <circle cx="130" cy="470" r="160" fill="#22C55E" opacity="0.07"/>
  <rect width="800" height="600" fill="url(#ar-glow)"/>

  <g transform="translate(400 300)">
    <!-- Joint capsule -->
    <ellipse cx="-30" cy="30" rx="196" ry="150" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="-30" cy="30" rx="196" ry="150" fill="none" stroke="#0F6CBD" stroke-width="5" stroke-dasharray="14 12" opacity="0.5"/>

    <!-- Upper bone end -->
    <path d="M-176 -128 h180 c22 0 40 18 40 40 v22 c0 26 -22 46 -48 46 h-172z"
          fill="url(#ar-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>
    <!-- Lower bone end -->
    <path d="M-176 92 h172 c26 0 48 20 48 46 v22 c0 22 -18 40 -40 40 h-180z"
          fill="url(#ar-bone)" stroke="#0F6CBD" stroke-width="7" stroke-linejoin="round"/>

    <!-- Scope light beam -->
    <path d="M96 8 l-150 -66 v132z" fill="url(#ar-beam)"/>

    <!-- Arthroscope: small incision, thin instrument -->
    <g transform="rotate(-22 120 10)">
      <rect x="96" y="-14" width="230" height="30" rx="15" fill="url(#ar-scope)"/>
      <rect x="286" y="-30" width="76" height="62" rx="18" fill="#0F6CBD"/>
      <circle cx="324" cy="1" r="15" fill="#EAF6FF"/>
      <circle cx="106" cy="1" r="12" fill="#22C55E"/>
    </g>

    <!-- Keyhole incision marks -->
    <path d="M84 -84 l18 -18 M84 96 l18 18" stroke="#0F6CBD" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
